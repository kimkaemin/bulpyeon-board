 +'<label for="wt">제목</label><input id="wt" maxlength="40" placeholder="한 줄로 요약해 주세요">'
 +'<label for="wb">내용</label><textarea id="wb" maxlength="1000" rows="6" placeholder="어떤 일이 있었고, 마음이 어땠는지 편하게 적어주세요."></textarea>'
 +'<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="wa" style="width:auto;margin-top:5px"><span>이용 규칙을 읽었고 동의해요. <a href="#rules" data-a="x" style="color:inherit">규칙 보기</a></span></label>'
 +'<div class="err" id="we"></div><div class="row"><button class="btn ghost" data-a="x">취소</button><button class="btn" data-a="post">올리기</button></div>')}
function rp(id,cid){modal('<h2>신고하기</h2><p class="hint">운영자가 확인할 수 있도록 이유를 알려주세요.</p><label for="rr">신고 사유</label><select id="rr">'+REASONS.map(function(r){return'<option>'+r+'</option>'}).join("")+'</select><div class="row"><button class="btn ghost" data-a="x">취소</button><button class="btn" data-a="sendrep" data-id="'+id+'"'+(cid?' data-c="'+cid+'"':'')+'>신고 접수</button></div>')}
function fp(id){return st.posts.filter(function(p){return p.id==id})[0]}
function voter(){return currentUserId}
function reportMap(rows,key){var out={};rows.forEach(function(r){var k=key(r);(out[k]||(out[k]=[])).push(r.reason)});return out}
async function refresh(){
 var results=await Promise.all([
  sb.from("board_posts").select("*").order("created_at",{ascending:false}),
  sb.from("board_comments").select("*").order("created_at"),
  sb.from("board_reactions").select("*")
 ]);
 var err=results.filter(function(x){return x.error})[0];if(err)throw err.error;
 var comments=results[1].data||[],reactions=results[2].data||[];
 var my={},posts=(results[0].data||[]).map(function(row){var p={id:row.id,author_id:row.author_id,t:row.title,c:row.body,cat:row.category,ts:Date.parse(row.created_at),h:row.hidden,r:{a:0,b:0,c:0},cm:[],rp:[]};
  reactions.filter(function(r){return r.post_id===row.id}).forEach(function(r){p.r[r.reaction]++;if(r.voter_key===voter())my[p.id+r.reaction]=1});
  p.cm=comments.filter(function(c){return c.post_id===row.id}).map(function(c){return{id:c.id,t:c.body,ts:Date.parse(c.created_at),h:c.hidden,rp:[]}});return p});
 st={n:0,my:my,posts:posts};render();
}
function dbError(err){console.error("Supabase request failed",err);toast("연결 오류: Supabase 설정과 테이블을 확인해 주세요.")}
async function send(action){try{await action();await refresh();return true}catch(err){dbError(err);return false}}
document.addEventListener("click",async function(e){var b=e.target.closest("[data-a]");if(!b){if(e.target.id==="ov")closeM();return}
 var a=b.dataset.a,id=b.dataset.id,cid=b.dataset.c,p=id?fp(id):null;
 if(a==="x"){closeM();return}
 if(a==="write"){wr();return}
 if(a==="cat"){cat=b.dataset.v}
 else if(a==="sort"){sort=b.dataset.v}
 else if(a==="open"){openId=openId==p.id?null:p.id}
 else if(a==="rx"){var k=p.id+b.dataset.v,v=b.dataset.v,removing=!!st.my[k];if(!currentUserId){toast("잠시 후 다시 눌러주세요.")}else if(await send(async function(){var q=removing?await sb.from("board_reactions").delete().eq("post_id",p.id).eq("reaction",v).eq("voter_key",voter()):await sb.from("board_reactions").insert({post_id:p.id,reaction:v,voter_key:voter()});if(q.error)throw q.error}))toast(removing?"공감을 취소했어요.":"공감이 전달됐어요.")}
 else if(a==="deletepost"){if(!p||p.author_id!==currentUserId){toast("작성자만 글을 삭제할 수 있어요.")}else if(confirm("정말 이 글을 삭제할까요? 댓글과 공감도 함께 삭제돼요.")){if(await send(async function(){var x=await sb.from("board_posts").delete().eq("id",p.id);if(x.error)throw x.error})){openId=null;toast("글을 삭제했어요.")}}}
 else if(a==="rep"){rp(id,cid);return}
 else if(a==="sendrep"){var reason=document.getElementById("rr").value;var q=await send(async function(){var x=await sb.from("board_reports").insert({post_id:id,comment_id:cid||null,reason:reason});if(x.error)throw x.error});if(q){closeM();toast("신고가 접수됐어요. 운영자가 검토할게요.")}}
 else if(a==="cmt"){var ta=document.getElementById("cmt"+id),t=ta.value.trim(),er=document.getElementById("ce"+id);
  if(t.length<2){er.textContent="댓글을 입력해 주세요.";return}
  var m=pii(t);if(m){er.textContent=m;return}
  if(await send(async function(){var x=await sb.from("board_comments").insert({post_id:id,body:t});if(x.error)throw x.error}))toast("따뜻한 댓글이 등록되었어요.")}
 else if(a==="post"){if(posting||Date.now()<postCooldownUntil)return;var t=document.getElementById("wt").value.trim(),c=document.getElementById("wb").value.trim(),er=document.getElementById("we");
  if(!t||c.length<10){er.textContent="제목과 내용을 입력해 주세요. 내용은 10자 이상 적어주세요.";return}
  var m=pii(t+" "+c);if(m){er.textContent=m;return}
  if(!document.getElementById("wa").checked){er.textContent="글을 올리려면 이용 규칙에 동의해 주세요.";return}
  posting=true;b.disabled=true;var didPost=await send(async function(){var x=await sb.from("board_posts").insert({title:t,body:c,category:document.getElementById("wc").value});if(x.error)throw x.error});posting=false;
  if(didPost){postCooldownUntil=Date.now()+2500;closeM();location.hash="";sort="new";cat="전체";toast("털어놓아 주셔서 고마워요. 글이 올라갔어요.")}else b.disabled=false}
 else if(a==="ok"||a==="hide"||a==="del"){toast("운영자 권한이 필요한 기능이에요. Supabase 대시보드에서 처리해 주세요.")}
 render()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
window.addEventListener("hashchange",function(){closeM();render();window.scrollTo(0,0)});
st={n:0,my:{},posts:[]};render();
async function startBoard(){var result=await sb.auth.getSession();if(result.error)throw result.error;var session=result.data.session;if(!session){var signed=await sb.auth.signInAnonymously();if(signed.error)throw signed.error;session=signed.data.session}currentUserId=session.user.id;await refresh()}
startBoard().catch(function(e){dbError(e)});
sb.channel("board-live-updates").on("postgres_changes",{event:"*",schema:"public",table:"board_posts"},function(){refresh().catch(dbError)})
 .on("postgres_changes",{event:"*",schema:"public",table:"board_comments"},function(){refresh().catch(dbError)})
 .on("postgres_changes",{event:"*",schema:"public",table:"board_reactions"},function(){refresh().catch(dbError)})
 .subscribe();
</script>
</body>
