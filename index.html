var SUPABASE_URL="https://kgbsbjxowacybxzkggcj.supabase.co";
var SUPABASE_ANON_KEY="sb_publishable_bafEz7pqjNzOpJkTiTlpUQ_9td2aw3s";

var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var st=null,sort="new",cat="전체",openId=null,postLimit=20,hasMore=false,currentUserId=null,currentUserEmail="",currentIsAnonymous=true,posting=false,postCooldownUntil=0,commentLocks={},commentCooldowns={},authBusy=false;
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}

function pii(s){
 if(/0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/.test(s))return"전화번호처럼 보이는 내용이 있어요. 지워주세요.";
 if(/[\w.+-]+@[\w-]+\.[\w.]+/.test(s))return"이메일 주소가 포함되어 있어요. 지워주세요.";
 if(/\d{6}-?[1-4]\d{6}/.test(s))return"주민등록번호처럼 보이는 내용이 있어요. 지워주세요.";
 if(/https?:\/\/|www\./i.test(s))return"링크나 계정 정보는 올릴 수 없어요.";
 if(/죽여\s?(버|야|주)|신상\s?(을\s)?(털|공개)|찾아가서|가만\s?안\s?둬/.test(s))return"위협이나 보복을 떠올리게 하는 표현이 있어요. 내 마음이 어땠는지 중심으로 바꿔 써주세요.";
 return""}
function nav(){var h=location.hash.replace("#","")||"home";
 var links=[["home","게시판"],["rules","이용 규칙"],["admin","신고·관리"]].map(function(x){return'<a href="#'+(x[0]==="home"?"":x[0])+'" class="'+(h===x[0]?"on":"")+'">'+x[1]+'</a>'}).join("");
 var pending="";try{pending=localStorage.getItem("painboard_pending_email")}catch(e){}
 var auth=currentUserId&&!currentIsAnonymous?'<button class="auth-nav" data-a="auth">'+(pending?"비밀번호 설정":esc(currentUserEmail||"내 계정"))+'</button><button class="auth-nav" data-a="authout">로그아웃</button>':'<button class="auth-nav" data-a="auth">로그인 · 회원가입</button>';
 document.getElementById("nav").innerHTML=links+auth}
function render(){nav();var h=location.hash.replace("#","")||"home",a=document.getElementById("app");
 var drafts={},active=document.activeElement&&document.activeElement.id,pos=null;

 if(active&&drafts[active]){var el=document.getElementById(active);pos=[el.selectionStart,el.selectionEnd]}
 a.innerHTML=h==="rules"?rules():h==="admin"?admin():h==="privacy"?privacy():home();
 Object.keys(drafts).forEach(function(id){var t=document.getElementById(id);if(t)t.value=drafts[id]});
 if(active&&drafts[active]){var f=document.getElementById(active);if(f){f.focus();if(pos)f.setSelectionRange(pos[0],pos[1])}}}
function home(){
 var ps=st.posts.filter(vis).filter(function(p){return cat==="전체"||p.cat===cat});
 ps.sort(function(x,y){return sort==="new"?y.ts-x.ts:total(y)-total(x)||y.ts-x.ts});
 return'<section class="hero"><h1><span>불편한</span> 게시판</h1><p>오늘의 불편함을 털어놓아 보세요</p><p class="hint">로그인 없이도 쓸 수 있어요. 털어놓고, 위로받고, 가볍게 돌아가요.</p><button class="btn big" data-a="write">글쓰기</button></section>'
 +'<div class="bar"><div class="chips">'+["전체"].concat(CATS).map(function(c){return'<button class="chip '+(cat===c?"on":"")+'" data-a="cat" data-v="'+c+'">'+c+'</button>'}).join("")+'</div>'
 +'<div class="chips"><button class="chip '+(sort==="new"?"on":"")+'" data-a="sort" data-v="new">최신순</button><button class="chip '+(sort==="like"?"on":"")+'" data-a="sort" data-v="like">공감순</button></div></div>'
 +(ps.length?ps.map(note).join(""):'<div class="empty">아직 이 분류에는 글이 없어요.<br>첫 이야기를 들려주시겠어요?</div>')
 +(hasMore?'<div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" data-a="more">글 더 보기</button></div>':'')}
function note(p){var o=openId===p.id,ci=CATS.indexOf(p.cat)+1,cm=p.cm.filter(function(c){return !c.h});
 var s='<article class="note cat'+ci+'"><div class="meta"><span>'+esc(p.cat)+'</span><span>'+ago(p.ts)+'</span></div><h3>'+esc(p.t)+'</h3><p class="txt'+(o?"":" clamp")+'">'+esc(p.c)+'</p>'
 +'<div class="rx">'+RX.map(function(r){return'<button class="'+(st.my[p.id+r[0]]?"me":"")+'" data-a="rx" data-id="'+p.id+'" data-v="'+r[0]+'" aria-pressed="'+!!st.my[p.id+r[0]]+'">'+r[1]+" "+p.r[r[0]]+'</button>'}).join("")+'</div>'
 +'<div class="foot"><button class="lnk" data-a="open" data-id="'+p.id+'">'+(o?"접기":"댓글 "+cm.length+"개 · 전체 보기")+'</button><button class="lnk" data-a="rep" data-id="'+p.id+'">신고</button>'+(currentUserId&&p.author_id===currentUserId?'<button class="lnk" data-a="deletepost" data-id="'+p.id+'">삭제</button>':'')+'</div>';
 if(o){s+='<div class="cm">'+(cm.length?cm.map(function(c){return'<div class="cmi">'+esc(c.t)+'<small>익명 · '+ago(c.ts)+' · <button class="lnk" data-a="rep" data-id="'+p.id+'" data-c="'+c.id+'">신고</button>'+(currentUserId&&c.author_id===currentUserId?' · <button class="lnk" data-a="deletecomment" data-id="'+p.id+'" data-c="'+c.id+'">삭제</button>':'')+'</small></div>'}).join(""):'<p class="hint">아직 댓글이 없어요. 따뜻한 한마디를 남겨주세요.</p>')
 +'<label for="cmt'+p.id+'">위로와 공감의 말을 남겨주세요</label><textarea id="cmt'+p.id+'" maxlength="300" placeholder="예) 정말 속상했겠어요. 오늘은 푹 쉬세요."></textarea><div class="err" id="ce'+p.id+'"></div><div class="row" style="margin-top:6px"><button class="btn sm" data-a="cmt" data-id="'+p.id+'">댓글 남기기</button></div></div>'}
 return s+'</article>'}
function rules(){return'<h2 class="pg">이용 규칙</h2><p class="hint">여기는 감정을 내려놓는 곳이에요. 누군가를 공격하는 곳이 아니라, 마음을 안전하게 꺼내 놓는 곳이에요.</p>'
 +'<div class="box warn"><b>이런 글은 올릴 수 없어요</b><ul><li>실명, 전화번호, 주소, 계정·아이디, 회사·학교 이름 등 개인을 알아볼 수 있는 정보</li><li>특정인을 괴롭히거나 위협하는 글</li><li>성별, 지역, 나이, 장애, 출신 등에 대한 혐오 표현</li><li>보복이나 신상 공개를 부추기는 내용</li><li>광고, 링크, 반복 도배</li></ul></div>'
 +'<div class="box"><b>이렇게 써주세요</b><ul><li>상대의 이름 대신 “상사”, “옆자리 손님”처럼 바꿔 써요.</li><li>누가 봐도 알 만한 시간, 장소, 사건 정보는 조금 바꾸거나 빼요.</li><li>상대를 평가하기보다 내가 겪은 일과 내 마음을 중심으로 써요.</li></ul></div>'
 +'<div class="box"><b>댓글은 이렇게 남겨요</b><ul><li>조언을 강요하기보다 먼저 공감해 주세요.</li><li>“그 정도로 뭘”처럼 마음을 가볍게 여기는 말은 삼가요.</li></ul></div>'
 +'<div class="box"><b>신고와 조치</b><p style="margin:6px 0 0">규칙에 어긋나는 글이나 댓글은 신고할 수 있어요. 서로 다른 3명 이상이 신고하면 글이나 댓글이 자동으로 가려져요. 한 사람이 같은 글을 여러 번 신고해도 1건으로 세어요. 가려진 글은 운영자가 검토해 삭제하거나 복구해요.</p></div>'
 +'<div class="box warn"><b>마음이 많이 힘들다면</b><p style="margin:6px 0 0">혼자 견디기 어려운 상황이라면 자살예방상담전화 109(24시간)나 정신건강상담전화 1577-0199에 연락해 보세요.</p></div>'
 +'<button class="btn" data-a="write">규칙을 확인했어요, 글쓰기</button>'}
function privacy(){return'<h2 class="pg">개인정보처리방침</h2><p class="hint">불편한 게시판이 어떤 정보를 받고 어떻게 쓰는지 알려드려요.</p>'
 +'<div class="box"><b>받는 정보</b><ul><li>익명으로 이용할 때: 브라우저마다 자동으로 만들어지는 임시 계정 ID</li><li>이메일로 가입할 때: 이메일 주소, 비밀번호(암호화되어 저장돼요)</li><li>Google로 로그인할 때: Google이 전달하는 이메일 주소와 프로필 정보</li><li>이용하면서: 직접 쓴 글, 댓글, 공감, 신고 내용</li></ul></div>'
 +'<div class="box"><b>쓰는 목적</b><ul><li>로그인과 본인 글·댓글 삭제 권한 확인</li><li>게시판 운영과 신고 처리, 도배 방지</li></ul></div>'
 +'<div class="box"><b>보관과 삭제</b><ul><li>정보는 Supabase(데이터베이스 서비스)에 저장돼요.</li><li>글과 댓글은 작성자가 직접 삭제할 수 있어요. 삭제하면 해당 글의 댓글과 공감도 함께 지워져요.</li><li>이메일 주소는 다른 이용자에게 보이지 않아요. 댓글과 글은 익명으로 표시돼요.</li><li>계정 삭제를 원하면 운영자에게 요청해 주세요.</li></ul></div>'
